name: CAPS to Skills Compilation

on:
  push:
    paths:
      - 'caps-library/playbooks/**/*.md'
      - 'caps-library/scripts/caps-to-skills.sh'
  pull_request:
    paths:
      - 'caps-library/playbooks/**/*.md'
      - 'caps-library/scripts/caps-to-skills.sh'

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bash 5.x
        run: |
          bash --version
          # Ubuntu runners already have bash 5.x

      - name: Verify compiler exists
        run: |
          if [[ ! -f "caps-library/scripts/caps-to-skills.sh" ]]; then
            echo "Error: Compiler script not found"
            exit 1
          fi
          chmod +x caps-library/scripts/caps-to-skills.sh

      - name: Find modified playbooks
        id: find-playbooks
        run: |
          # Get list of modified playbook.md files
          MODIFIED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "caps-library/playbooks/.*/playbook.md" || true)

          if [[ -z "$MODIFIED_FILES" ]]; then
            echo "No playbooks modified"
            echo "playbooks=" >> $GITHUB_OUTPUT
          else
            # Extract playbook names
            PLAYBOOKS=""
            for file in $MODIFIED_FILES; do
              playbook=$(echo "$file" | sed 's|caps-library/playbooks/\(.*\)/playbook.md|\1|')
              PLAYBOOKS="$PLAYBOOKS $playbook"
            done
            echo "Modified playbooks: $PLAYBOOKS"
            echo "playbooks=$PLAYBOOKS" >> $GITHUB_OUTPUT
          fi

      - name: Validate playbooks
        if: steps.find-playbooks.outputs.playbooks != ''
        run: |
          # Validate each modified playbook
          for playbook in ${{ steps.find-playbooks.outputs.playbooks }}; do
            echo "================================================"
            echo "Validating playbook: $playbook"
            echo "================================================"

            bash caps-library/scripts/caps-to-skills.sh "$playbook" --validate --dry-run

            if [[ $? -ne 0 ]]; then
              echo "::error::Validation failed for playbook: $playbook"
              exit 1
            fi
          done

      - name: Compile playbooks
        if: steps.find-playbooks.outputs.playbooks != ''
        run: |
          # Compile each validated playbook
          for playbook in ${{ steps.find-playbooks.outputs.playbooks }}; do
            echo "================================================"
            echo "Compiling playbook: $playbook"
            echo "================================================"

            bash caps-library/scripts/caps-to-skills.sh "$playbook" --validate

            if [[ $? -ne 0 ]]; then
              echo "::error::Compilation failed for playbook: $playbook"
              exit 1
            fi
          done

      - name: Commit generated skills
        if: github.event_name == 'push' && steps.find-playbooks.outputs.playbooks != ''
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Add all generated skill files
          git add .claude/skills/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: auto-compile CAPS playbooks to skills

            Updated playbooks: ${{ steps.find-playbooks.outputs.playbooks }}

            🤖 Generated by GitHub Actions"
            git push
          fi

      - name: Upload compilation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-skills
          path: .claude/skills/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## CAPS Compilation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Modified playbooks: ${{ steps.find-playbooks.outputs.playbooks }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: ✅ All playbooks validated and compiled successfully" >> $GITHUB_STEP_SUMMARY
